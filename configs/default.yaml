# Setup used in the paper (paper/Final_Report_EEG_Unlearning_Torabi.pdf).
data_dir: data/raw
output_dir: results

recording_seconds: 60.0   # sampling rate is estimated from rows / recording_seconds
window_seconds: 2.0
step_seconds: 1.5         # training windows overlap; test windows do not
train_ratio: 0.8          # first 80% of each recording for training, last 20% for testing

subject_to_forget: 14
seed: 42

n_estimators: 120
max_depth: 8
min_samples_split: 20
min_samples_leaf: 8

fuzzy_k: 20
