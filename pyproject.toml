[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-unlearning"
version = "1.0.0"
description = "Subject-level machine unlearning for EEG classification: baseline vs. exact vs. fuzzy unlearning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shahrzad Torabi" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
notebook = ["jupyter"]

[project.scripts]
eeg-unlearn = "eeg_unlearning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["N803", "N806"]
